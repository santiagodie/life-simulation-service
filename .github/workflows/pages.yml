name: Build and Deploy Pages

# Publishes the static demo (root) and the aggregated Javadoc (/doc/)
# after the tests on main have passed.
on:
  workflow_run:
    workflows: ["Test and Promote"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install modules
        run: mvn -B install -DskipTests

      - name: Generate Javadoc
        run: mvn -B javadoc:aggregate

      - name: Assemble site (demo + Javadoc in /doc/)
        run: bash demo/build-site.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
